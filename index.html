<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bikewatching - Boston Bike Traffic</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="map.css">
    <link
        href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >
    <script src="map.js" type="module"></script>
</head>
<body>
    <header>
        <div>
            <h1>Bikewatching</h1>
            <p>Explore Bluebike traffic and cycling infrastructure across Boston and Cambridge.</p>
        </div>

        <label class="time-control" for="time-slider">
            <span>Filter trips within one hour of:</span>
            <input id="time-slider" type="range" min="-1" max="1440" value="-1" step="1" disabled>
            <time id="selected-time"></time>
            <em id="any-time">Any time</em>
        </label>
    </header>

    <main>
        <div id="map" aria-label="Map of Boston bike traffic">
            <div id="map-canvas"></div>
            <svg aria-label="Bluebike station traffic markers"></svg>
            <p id="map-status" role="status">Loading map and trip data...</p>
        </div>

        <div class="legend" aria-label="Traffic flow legend">
            <strong>Station flow:</strong>
            <div style="--departure-ratio: 1"><span></span>More departures</div>
            <div style="--departure-ratio: 0.5"><span></span>Balanced</div>
            <div style="--departure-ratio: 0"><span></span>More arrivals</div>
        </div>
    </main>
</body>
</html>
